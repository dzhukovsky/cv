env:
  browser: true
  es2021: true
extends:
  - standard-with-typescript
  - plugin:react/recommended
parserOptions:
  jsx: true
  ecmaVersion: latest
  sourceType: module
plugins:
  - react
settings:
  react:
    version: detect 
rules: {
  "@typescript-eslint/strict-boolean-expressions": "off",
  "@typescript-eslint/no-non-null-assertion": "off",
  "@typescript-eslint/no-dynamic-delete": "off",
}
