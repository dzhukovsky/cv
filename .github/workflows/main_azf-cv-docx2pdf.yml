name: Build & Deploy azf-cv-docx2pdf

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main_azf-cv-docx2pdf.yml'
      - 'azure/azf-cv-docx2pdf/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  CWD: './azure/azf-cv-docx2pdf'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.CWD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            ${{ env.CWD }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'azf-cv-docx2pdf'
      url: ${{ steps.deploy-to-function.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C09325C744A7444E85C7B31071498F1E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2C06F2A44FB1472CAEC97B0C0CE6F49B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8EE101EC00A44ED59E3097E545D18961 }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'azf-cv-docx2pdf'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
