on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_predeploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    environment: prod
    runs-on: ubuntu-latest
    name: Build & Predeploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.STAPP_CV_PROD_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: 'upload'
          app_location: 'dist/client'
          api_location: 'api'
          skip_app_build: true

  finalize_deploy_for_closed_pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    environment: prod
    runs-on: ubuntu-latest
    name: Finalize Deploy for Closed PR
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          app_location: null
          azure_static_web_apps_api_token: ${{ secrets.STAPP_CV_PROD_API_TOKEN }}
          action: 'close'
